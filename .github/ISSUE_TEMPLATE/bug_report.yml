name: Bug report
description: Report a reproducible problem in the simulator.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data only. Do not include AWS credentials, sandbox keys, banking details, or personal data.
        Report vulnerabilities privately using the repository's security policy.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and whether you were using Demo or Bedrock mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal fictional request and the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Bun version, and commit or branch.
      placeholder: "Windows 11, Chrome, Bun 1.3.14, commit abc1234"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and identifying information before attaching anything.
